name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.5.0

jobs:
  python-security:
    name: Python Security & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install bandit flake8 ruff

      - name: Run Bandit
        run: bandit -r lambdas/ -ll -f txt || true

      - name: Run Flake8
        run: flake8 lambdas/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Ruff
        run: ruff check lambdas/ || true

  terraform-security:
    name: Terraform Validation & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: cd terraform && terraform fmt -check -recursive || true

      - name: Terraform Init
        run: |
          cd terraform
          rm -rf .terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: cd terraform && terraform validate

      - name: Install & Run tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash || true
          tfsec terraform/ --no-color || true

      - name: Install & Run Checkov
        run: |
          pip install checkov
          checkov -d terraform/ --framework terraform --compact || true
