name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.5.0

jobs:
  # Job 1: Lint & Security Scan Python Code
  python-security:
    name: Python Security & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit flake8 ruff
      
      - name: Run Bandit (Security Scanner)
        run: |
          bandit -r lambdas/ -f json -o bandit-report.json || true
          bandit -r lambdas/ -ll -f txt
        continue-on-error: true
      
      - name: Run Flake8 (Linting)
        run: |
          flake8 lambdas/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 lambdas/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run Ruff (Fast Linter)
        run: |
          ruff check lambdas/ --output-format=github
        continue-on-error: true
      
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

  # Job 2: Terraform Validation & Security
  terraform-security:
    name: Terraform Validation & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false
      
      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate
      
      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      
      - name: Run tfsec (Terraform Security Scanner)
        run: |
          tfsec terraform/ --format json --out tfsec-report.json || true
          tfsec terraform/ --no-color
        continue-on-error: true
      
      - name: Install Checkov
        run: |
          pip install checkov
      
      - name: Run Checkov (IaC Security)
        run: |
          checkov -d terraform/ --framework terraform --output json --output-file checkov-report.json || true
          checkov -d terraform/ --framework terraform --compact
        continue-on-error: true
      
      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        with:
          name: terraform-security-reports
          path: |
            tfsec-report.json
            checkov-report.json
        if: always()

  # Job 3: Deploy to AWS (only on main branch)
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [python-security, terraform-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init
      
      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan
      
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
      
      - name: Update Lambda Functions
        run: |
          echo "Lambda functions updated via Terraform"
      
      - name: Deployment Summary
        run: |
          cd terraform
          terraform output -json > outputs.json
          echo "Deployment completed successfully!"
          cat outputs.json

  # Job 4: Run Tests (Post-Deployment)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install test dependencies
        run: |
          pip install requests boto3
      
      - name: Run Health Checks
        run: |
          echo "Running API health checks..."
          # Add health check script here
          echo "Health checks passed!"
