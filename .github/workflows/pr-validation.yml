name: PR Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install bandit flake8 ruff
      
      - name: Security & Lint Check
        run: |
          bandit -r lambdas/ -ll
          flake8 lambdas/ --count --select=E9,F63,F7,F82 --show-source
          ruff check lambdas/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      
      - name: PR Size Check
        run: |
          files_changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | wc -l)
          echo "Files changed: $files_changed"
          if [ $files_changed -gt 50 ]; then
            echo "⚠️  PR is large ($files_changed files). Consider breaking it up."
          fi
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All validation checks passed! Ready for review.'
            })
